<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Dominó</title>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#1a1a2e"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <link rel="apple-touch-icon" href="icon.svg"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header class="bar">
    <div class="title">Dominó</div>
    <button id="reset" class="btn-danger">Nueva partida</button>
  </header>

  <main class="wrap">

    <div class="scores">
      <div class="team-card" id="cardHome">
        <div class="team-name" id="homeLabel">HOME</div>
        <div class="team-score" id="homeTotal">0</div>
      </div>
      <div class="vs">VS</div>
      <div class="team-card" id="cardVis">
        <div class="team-name" id="visLabel">VISITORS</div>
        <div class="team-score" id="visTotal">0</div>
      </div>
    </div>

    <div class="winner-bar" id="winnerBar"></div>

    <section class="card" id="configSection">
      <h2>Configurar partida</h2>
      <div class="grid2">
        <label>Equipo local
          <input id="homeName" placeholder="HOME"/>
        </label>
        <label>Equipo visitante
          <input id="visName" placeholder="VISITORS"/>
        </label>
      </div>
      <label class="inline">Meta de puntos:
        <input id="target" type="tel" inputmode="numeric" pattern="[0-9]*" value="200"/>
      </label>
      <button id="startGame" class="btn-primary">▶ Iniciar partida</button>
    </section>

    <section class="card" id="gameSection" style="display:none">
      <h2>Anotar mano <span class="hand-count" id="handCount">#0</span></h2>
      <div class="grid2">
        <div class="input-group">
          <div class="team-badge home" id="homeBadge">HOME</div>
          <input id="homePts" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="Puntos"/>
          <button id="addHome" class="btn-home">Añadir</button>
        </div>
        <div class="input-group">
          <div class="team-badge vis" id="visBadge">VISITORS</div>
          <input id="visPts" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="Puntos"/>
          <button id="addVis" class="btn-vis">Añadir</button>
        </div>
      </div>
      <div class="row">
        <button id="undo" class="btn-secondary">↩ Deshacer</button>
        <button id="finishNow" class="btn-secondary">🏁 Finalizar</button>
      </div>
    </section>

    <section class="card winner-card" id="winnerSection" style="display:none">
      <div class="winner-emoji" id="winnerEmoji">🏆</div>
      <div class="winner-text" id="winnerText"></div>
      <button id="newGame" class="btn-primary">Nueva partida</button>
    </section>

    <section class="card" id="histSection" style="display:none">
      <h2>Historial</h2>
      <div class="tableWrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Equipo</th>
              <th>Pts</th>
              <th id="thHome">HOME</th>
              <th id="thVis">VISITORS</th>
            </tr>
          </thead>
          <tbody id="hands"></tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
