<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Dominó</title>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#18181B"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <link rel="apple-touch-icon" href="icon.svg"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- Setup -->
  <div id="setup">
    <div class="setup-inner">
      <div class="logo">Dominó</div>
      <p class="logo-sub">Marcador de partidas</p>

      <div class="fields">
        <div class="field">
          <label for="homeName">Equipo local</label>
          <input id="homeName" placeholder="HOME" autocomplete="off" spellcheck="false"/>
        </div>
        <div class="field">
          <label for="visName">Equipo visitante</label>
          <input id="visName" placeholder="VISITORS" autocomplete="off" spellcheck="false"/>
        </div>
        <div class="field">
          <label for="target">Meta de puntos</label>
          <input id="target" type="tel" inputmode="numeric" pattern="[0-9]*" value="200"/>
        </div>
      </div>

      <button id="startGame" class="btn-cta">Iniciar partida</button>
    </div>
  </div>

  <!-- Game -->
  <div id="game" style="display:none">

    <header class="topbar">
      <span class="topbar-title">Dominó</span>
      <button id="reset" class="btn-ghost-sm">Nueva partida</button>
    </header>

    <div class="scores">
      <div class="team" id="teamHome">
        <div class="team-label" id="homeLabel">HOME</div>
        <div class="team-score" id="homeTotal">0</div>
      </div>
      <div class="scores-sep"></div>
      <div class="team" id="teamVis">
        <div class="team-label" id="visLabel">VISITORS</div>
        <div class="team-score" id="visTotal">0</div>
      </div>
    </div>

    <div class="lead-bar" id="leadBar"></div>

    <div class="inputs">
      <div class="inp-row">
        <input id="homePts" class="inp inp-home" type="tel" inputmode="numeric"
               pattern="[0-9]*" placeholder="Puntos"/>
        <button id="addHome" class="btn-add btn-add-home">
          + <span id="homeBadge">HOME</span>
        </button>
      </div>
      <div class="inp-row">
        <input id="visPts" class="inp inp-vis" type="tel" inputmode="numeric"
               pattern="[0-9]*" placeholder="Puntos"/>
        <button id="addVis" class="btn-add btn-add-vis">
          + <span id="visBadge">VISITORS</span>
        </button>
      </div>
      <div class="acts">
        <button id="undo" class="btn-act">↩ Deshacer</button>
        <button id="finishNow" class="btn-act">Finalizar</button>
      </div>
    </div>

    <div class="hist" id="hist" style="display:none">
      <div class="hist-head">
        <span>Historial</span>
        <span id="handCount" class="hist-count"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Equipo</th>
              <th>Pts</th>
              <th id="thHome">HOME</th>
              <th id="thVis">VISITORS</th>
            </tr>
          </thead>
          <tbody id="hands"></tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Winner -->
  <div id="winner" style="display:none">
    <div class="winner-inner">
      <div class="w-trophy" id="wTrophy">🏆</div>
      <div class="w-who" id="wWho"></div>
      <div class="w-pts" id="wPts"></div>
      <button id="newGame" class="btn-cta">Nueva partida</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
  </script>
</body>
</html>
